<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="50%" stop-color="#070c18"/>
      <stop offset="100%" stop-color="#03050a"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="60%" stop-color="#0070f3"/>
      <stop offset="100%" stop-color="#0038a8"/>
    </linearGradient>
    <linearGradient id="flareGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3366"/>
      <stop offset="100%" stop-color="#ff0044"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(0, 229, 255, 0.2)" stroke-width="6"/>

  <!-- Radar sweep circle -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="rgba(0, 229, 255, 0.12)" stroke-width="4"/>
  <circle cx="256" cy="256" r="130" fill="none" stroke="rgba(0, 229, 255, 0.15)" stroke-width="3" stroke-dasharray="8 6"/>
  <circle cx="256" cy="256" r="70" fill="none" stroke="rgba(0, 229, 255, 0.2)" stroke-width="2"/>

  <!-- Center Shield Icon -->
  <g filter="url(#glow)">
    <path d="M256 90 L370 145 C370 270 290 355 256 395 C222 355 142 270 142 145 Z" fill="url(#shieldGrad)" stroke="#ffffff" stroke-width="4" stroke-opacity="0.8"/>
  </g>

  <!-- Maritime Lifebuoy Ring & Waves inside shield -->
  <!-- Wave crests -->
  <path d="M190 280 Q220 250 256 280 T322 280" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
  <path d="M210 315 Q235 295 256 315 T302 315" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="8" stroke-linecap="round"/>

  <!-- Emergency Flash Cross / Beacon -->
  <circle cx="256" cy="200" r="28" fill="url(#flareGrad)" stroke="#ffffff" stroke-width="4"/>
  <path d="M256 182 V218 M238 200 H274" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>

  <!-- Pulse dots -->
  <circle cx="360" cy="180" r="10" fill="#00e5ff" filter="url(#glow)"/>
  <circle cx="160" cy="330" r="8" fill="#ff0055" filter="url(#glow)"/>
</svg>
